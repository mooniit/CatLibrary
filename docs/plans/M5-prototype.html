<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>喵的图书馆 · 商店与布置原型</title>
<style>
:root{color-scheme:light;--bg:#eef2f6;--panel:#fff;--ink:#263544;--muted:#617387;--line:#dae2eb;--accent:#496b8c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Microsoft YaHei",sans-serif}body.night{--bg:#18212b;--panel:#253240;--ink:#e7edf4;--muted:#a6b7c8;--line:#415469;--accent:#9ab8d5}header{padding:22px 28px;display:flex;justify-content:space-between;gap:12px}h1{font-size:22px;margin:0}h2{font-size:20px;margin:8px 0}p{margin:8px 0;color:var(--muted)}button,select{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:10px 14px;cursor:pointer}button:focus-visible{outline:3px solid var(--accent)}button.primary{background:var(--accent);color:var(--panel)}button:disabled{opacity:.6;cursor:default}.screens{display:flex;gap:30px;align-items:flex-start;justify-content:center;padding:0 20px 30px;flex-wrap:wrap}.phone{width:390px;max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:24px;overflow:hidden}.top{padding:20px}.bar{display:flex;gap:10px;align-items:center;justify-content:space-between}.tabs{display:flex;gap:8px;margin:16px 0}.tabs button[aria-selected=true]{border-color:var(--accent);color:var(--accent)}.items{padding:0 20px}.item{display:flex;align-items:center;gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}.item img{width:96px;height:116px;object-fit:contain}.item section{flex:1}.item strong{display:block;font-size:18px}.small{font-size:13px}.actions{padding:16px 20px;background:var(--panel);border-top:1px solid var(--line)}.room{height:360px;position:relative;background:#d9e4ee}.room img{width:100%;height:100%;object-fit:contain}.room canvas{position:absolute;inset:0;width:100%;height:100%}.hint{padding:10px 16px;background:var(--bg);font-size:14px}.controls{display:flex;gap:8px;flex-wrap:wrap}.list{padding:8px 20px}.row{padding:12px 0;display:flex;justify-content:space-between;align-items:center}.notice{padding:14px;border:1px solid var(--line);border-radius:12px;margin-top:12px}#toast{min-height:30px;color:var(--accent)}.caption{max-width:850px;margin:0 auto 20px;padding:0 20px}
</style>
<header><div><h1>喵的图书馆</h1><p>商店与布置 · 可操作界面原型</p></div><button onclick="document.body.classList.toggle('night')">切换白色／雾蓝夜晚</button></header>
<p class="caption">价格为待确认建议，库存为演示数据。本原型不连接钱包、不购买。单品“确认”加入草稿，整屋“保存到家庭”才提交。</p>
<main class="screens">
<article class="phone"><div class="top"><h2>商店</h2><div class="bar"><span>喵喵币 240</span><button onclick="say('兑换入口沿用鹰镑／宝石 1:5 兑换')">币种兑换</button></div><div class="tabs"><button id="goods" aria-selected="true" onclick="tab(false)">商品</button><button id="inventory" aria-selected="false" onclick="tab(true)">家庭库存</button></div><select aria-label="套系" onchange="theme(this.value)"><option value="wood">简约木质</option><option value="lunar">月轨阅读舱</option><option value="royal">英式皇家</option></select><p class="small" id="shopHint">每件独立购买 · 个人付款，家庭使用</p></div><div class="items" id="items"></div><div class="actions"><button class="primary" onclick="say('进入布置前：读取最新家庭布局并获取编辑权')">布置小屋</button><p id="toast" aria-live="polite"></p></div></article>
<article class="phone"><div class="top"><div class="bar"><h2>布置小屋</h2><button onclick="say('离开会保留草稿，正常释放编辑权')">离开</button></div><p class="small">正在编辑 · 家庭版本 12 · 租约数值待确认</p></div><div class="room"><img src="../../design/room-themes-2026-10-06/wood-day-preview.png" alt="现有木质家具在固定房屋中的组合"><canvas id="grid" width="390" height="360"></canvas></div><div class="hint" id="editorHint">已选：木质椅子 · 拖动网格预览位置</div><div class="actions controls"><button onclick="facing=facing==='x'?'y':'x';editHint()">切换朝向</button><button onclick="say('收起到草稿库存，不销毁或复制实例')">收起</button><button onclick="say('已确认到草稿，家庭布局还未保存')">确认</button><button onclick="gx=5;gy=1;draw();say('已取消单品预览')">取消</button></div><div class="list"><div class="row"><strong>已摆放物品</strong><button onclick="say('被遮挡的家具可从列表选择')">查看全部</button></div><p>木质椅子 ×1　木质书柜 ×1</p><div class="row"><strong>固定位置</strong><select aria-label="固定位置"><option>左窗</option><option>右窗</option><option>左墙画位1</option><option>左墙画位2</option><option>右墙画位1</option><option>右墙画位2</option><option>中央地毯</option></select></div><p class="small">窗／画位每位一件；地毯不可拖动。</p><div class="notice" id="saveState">草稿有修改，尚未保存到家庭。</div></div><div class="actions"><button class="primary" onclick="document.getElementById('saveState').textContent='演示：收到正式成功回执后，才显示保存成功。对方收到提示，手动刷新查看。'">保存到家庭</button> <button onclick="document.getElementById('saveState').textContent='演示：断网，草稿和请求编号已保留。编辑暂停；重连先核对原请求。'">模拟断网</button></div></article>
</main>
<script>
let chosen='wood',owned=false,gx=5,gy=1,facing='y';
const names={bookshelf:'书柜',desk:'书桌',chair:'椅子',tree:'猫爬架',bed:'开放猫窝',window:'窗户',rug:'中央地毯',frame:'画框',wall:'墙面',floor:'地板'};
const prices={bookshelf:120,desk:100,chair:40,tree:140,bed:60,window:60,rug:80,frame:30,wall:100,floor:100};
function say(s){document.getElementById('toast').textContent=s}function tab(v){owned=v;document.getElementById('goods').setAttribute('aria-selected',!v);document.getElementById('inventory').setAttribute('aria-selected',v);render()}function theme(v){chosen=v;render()}
function render(){document.getElementById('items').innerHTML=Object.keys(names).map(k=>{let file=['bookshelf','desk','chair','tree','bed'].includes(k)?k+'-x':k==='window'?'window-left':k==='frame'?'frame-landscape-left':k==='wall'?'wall-left':k;let root=chosen==='lunar'?'../../assets/images/room/lunar-v5/':'../../design/room-themes-2026-10-06/'+chosen+'/';return '<div class="item"><img src="'+root+file+'.png" alt="'+names[k]+'"><section><strong>'+names[k]+'</strong><p class="small">'+(owned?'演示：拥有 1 · 已摆 1 · 可摆 0':'建议 '+Math.round(prices[k]*(chosen==='wood'?1:chosen==='lunar'?1.5:2))+' 喵喵币')+'</p><button onclick="say(\'价格与权益确认后才启用正式购买；此处不扣款\')">'+(owned?'查看实例／购买人':'查看购买')+'</button></section></div>'}).join('')}
function project(x,y){return [195+(x-y)*173/8,179+(x+y)*86.35/8]}
function draw(){let c=document.getElementById('grid').getContext('2d');c.clearRect(0,0,390,360);c.strokeStyle='#5d7d9988';for(let i=0;i<=8;i++){for(let axis=0;axis<2;axis++){let a=project(axis?0:i,axis?i:0),b=project(axis?8:i,axis?i:8);c.beginPath();c.moveTo(...a);c.lineTo(...b);c.stroke()}}let points=[[gx,gy],[gx+1,gy],[gx+1,gy+1],[gx,gy+1]].map(p=>project(...p));c.beginPath();c.moveTo(...points[0]);points.slice(1).forEach(p=>c.lineTo(...p));c.closePath();c.fillStyle='#779bbcaa';c.fill();editHint()}
function editHint(){document.getElementById('editorHint').textContent='椅子预览：格 ['+gx+','+gy+'] · 正面 +'+facing.toUpperCase()+' · 确认仅加入草稿'}
document.getElementById('grid').addEventListener('pointerdown',e=>{e.target.setPointerCapture(e.pointerId)});document.getElementById('grid').addEventListener('pointermove',e=>{if(!e.buttons)return;let r=e.target.getBoundingClientRect(),x=(e.clientX-r.left)*390/r.width-195,y=(e.clientY-r.top)*360/r.height-179;gx=Math.max(0,Math.min(7,Math.floor((x/173+y/86.35)*4)));gy=Math.max(0,Math.min(7,Math.floor((y/86.35-x/173)*4)));draw()});render();draw();
</script>
