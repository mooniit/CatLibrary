<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CatLibrary · 木质与皇家</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3efe6;color:#3b342b;font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1240px;margin:auto;padding:34px 26px}header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:24px}h1{font-size:29px;letter-spacing:.03em;margin:0}h2{font-size:21px;margin:36px 0 14px}h3{font-size:16px;margin:0 0 10px}p{margin:8px 0;color:#756859}a{color:inherit}select,button{font:inherit;border:1px solid #c9bcaa;border-radius:7px;padding:7px 10px;background:#fffaf1;color:inherit}button{cursor:pointer}label{display:inline-flex;align-items:center;gap:6px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 275px;gap:22px}.stage{background:#243c50;border-radius:12px;overflow:hidden}.stage svg{display:block;width:100%;height:auto;aspect-ratio:1080/1073}aside{background:#fffaf1;padding:20px;border-radius:12px}aside .group{display:grid;gap:9px;margin-bottom:22px}aside .checks{display:flex;gap:8px 16px;flex-wrap:wrap}aside select{width:100%}.status{font-size:12px;margin-top:16px;color:#887761}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}article{background:#fffaf1;border:1px solid #dfd6c7;border-radius:10px;padding:16px}article p{font-size:13px}.pair{display:flex;align-items:center;justify-content:space-around;gap:10px;min-height:170px}.pair a{display:flex;flex-direction:column;align-items:center;text-decoration:none;width:48%;font-size:12px}.pair img{width:100%;height:170px;object-fit:contain}.window-pair{position:relative;height:170px}.window-pair img{position:absolute;inset:0;width:100%;height:170px;object-fit:contain}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #dcd0bf}.table-wrap{overflow:auto}footer{margin-top:30px;font-size:13px}input{accent-color:#8d713e}@media(max-width:760px){main{padding:20px 14px}header{align-items:start;flex-direction:column}.layout{grid-template-columns:1fr}aside{display:grid;grid-template-columns:1fr 1fr;gap:15px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:440px){aside,.gallery{grid-template-columns:1fr}.pair img{height:210px}}
</style></head><body><main><header><div><h1>木质与皇家</h1><p id="subtitle"></p></div><label>家居主题 <select id="theme"><option value="wood">简约木质</option><option value="royal">英式皇家</option></select></label></header>
<section class="layout"><div class="stage"><svg id="room" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1073" aria-label="固定房屋组合预览"></svg></div><aside>
<div class="group"><h3>房间预览</h3><label>窗外 <select id="mode"><option value="day">清晨天空</option><option value="night">夜晚天空</option></select></label><div class="checks"><label><input id="leftWindow" type="checkbox" checked>左窗</label><label><input id="rightWindow" type="checkbox" checked>右窗</label><label><input id="rug" type="checkbox" checked>地毯</label><label><input id="art" type="checkbox" checked>装饰画</label><label><input id="grid" type="checkbox">占格</label></div></div>
<div class="group"><h3>家具朝向</h3><select id="item"><option value="bookshelf">书柜</option><option value="desk">书桌</option><option value="chair">椅子</option><option value="tree">猫爬架</option><option value="bed">猫窝</option></select><button id="rotate">转向</button><button id="hide">隐藏此件</button></div>
<div class="group"><h3>可复用画框</h3><select id="frame-slot"><option value="art-left-back">左墙后画位</option><option value="art-left-front">左墙前画位</option><option value="art-right-back">右墙后画位</option><option value="art-right-front">右墙前画位</option></select><select id="frame-template"><option value="landscape">横版</option><option value="portrait">竖版</option><option value="square">正方形</option></select><select id="picture"><option value="starry">猫爪星空</option><option value="pearl">戴珍珠耳环的猫</option><option value="">留空模板</option></select></div><button id="reset">恢复默认布置</button><div id="status" class="status"></div></aside></section>
<h2>独立家具 · 两个朝向</h2><section id="gallery" class="gallery"></section><h2>实体画框 · 三种模板</h2><section id="frame-gallery" class="gallery"></section><h2>配套窗户</h2><section id="window-gallery" class="gallery"></section>
<h2>尺寸与接地锚点</h2><p>单位为格。尺寸顺序 X × Y × Z；接地锚点为完整家具占格内的后角。各素材的像素锚点与占格逐项记录在 manifest.json 中。</p><div class="table-wrap"><table><thead><tr><th>物品 / 朝向</th><th>完整尺寸</th><th>占格</th><th>格锚点</th><th>接地坐标 X,Y,Z</th></tr></thead><tbody id="table"></tbody></table></div>
<footer><a href="README.md">设计说明与制作规则</a> · <a href="wood/manifest.json">木质素材清单</a> · <a href="royal/manifest.json">皇家素材清单</a> · <a href="../room-structure-2026-10-05/">固定房屋标准</a></footer></main><script type="module" src="preview.mjs"></script></body></html>
