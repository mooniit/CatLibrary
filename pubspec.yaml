name: cat_library_demo
description: M0 interaction and feasibility probes for 喵的图书馆.
publish_to: none
version: 0.1.9+10
environment:
  sdk: '>=3.11.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flame: 1.38.2
  drift: 2.35.0
  drift_flutter: 0.3.1
  supabase_flutter: 2.17.2
  cupertino_icons: 1.0.8
  image_picker: 1.2.3
  shared_preferences: 2.5.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/images/room/
    - assets/images/room/lunar-v5/
    - assets/images/room/wood/
    - assets/images/room/royal/
    - assets/images/room/souvenirs-v2/
    - assets/data/
